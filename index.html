<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe | 温もりあふれる自家焙煎カフェ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================================
        ヘッダー
    ========================================== -->
    <header class="header">
        <div class="header__inner">

            <!-- ロゴ -->
            <h1 class="header__logo">
                <a href="index.html">
                    <img src="img/logo.png" alt="CAFE NAME">
                </a>
            </h1>

            <!-- ヘッダーメニュー -->
            <nav class="header__nav">
                <ul class="header__list">
                    <li class="header__item">
                        <a href="#about">About</a>
                    </li>
                    <li class="header__item">
                        <a href="#menu">Menu</a>
                    </li>
                    <li class="header__item">
                        <a href="#news">News</a>
                    </li>
                    <li class="header__item">
                        <a href="#access">Access</a>
                    </li>
                    <li class="header__item">
                        <a href="#contact">Reserve / Contact</a>
                    </li>
                </ul>
            </nav>

            <!-- ハンバーガーメニュー -->
            <button type="button" class="header__hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </header>

    <main>

        <!-- =========================================
            メインビジュアル
        ========================================== -->
        <section class="mv">
            <div class="mv__slider">
                <div class="mv__slide is-active">
                    <div class="mv__img">
                        <img src="img/top-mv1.jpg" alt="店内">
                    </div>
                    <div class="mv__content">
                        <p class="mv__text">
                            心地よい香りと、ゆったりとした時間を。
                        </p>
                    </div>
                </div>
                <div class="mv__slide">
                    <div class="mv__img">
                        <img src="img/top-mv2.jpg" alt="コーヒー">
                    </div>
                    <div class="mv__content">
                        <p class="mv__text">
                            一杯ずつ丁寧に淹れる、こだわり珈琲。
                        </p>
                    </div>
                </div>
                <div class="mv__slide">
                    <div class="mv__img">
                        <img src="img/top-mv3.jpg" alt="スイーツ">
                    </div>
                    <div class="mv__content">
                        <p class="mv__text">
                            こころほころぶ、自家製スイーツとともに。
                        </p>
                    </div>
                </div>
            </div>

        </section>

        <!-- =========================================
            お店のこだわり
        ========================================== -->
        <section class="about" id="about">
            <div class="about__inner">
                <div class = "about__header">
                    <h2 class="about__title">
                        <span class="about__title-en">
                            About
                        </span>
                        <span class="about__title-ja">
                            お店のこだわり
                        </span>
                    </h2>
                </div>
                <div class="about__info">
                    <div class="about__imgbox js-fade">
                        <img src="img/about-img.jpg" alt="店内のゆったりした雰囲気" class="about__img">
                    </div>
                    <div class="about__textbox js-fade js-fade-delay">
                        <h3 class="about__copy">
                            日常のなかに、<br>
                            ほっとひと息つく贅沢を。
                        </h3>
                        <p class="about__text">
                            厳選した豆を丁寧に焙煎した特別な一杯と、素材にこだわった自家製スイーツでおもてなしいたします。<br>
                            木の温もりあふれる落ち着いた空間で、日常の忙しさを忘れ、思い思いの心地よい時間をお過ごしください。
                        </p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="js/main.js"></script>

</body>
</html>
